<div style="width: 100%;height: 100% !important;position: absolute;">
    <div class="header-panel">
        <mat-icon>lan</mat-icon>
        {{'device.list-title' | translate}}
    </div>
    <div class="work-panel">
        <app-device-tree #devicetree [readonly]="readonly"></app-device-tree>
    </div>
</div>
<button mat-icon-button (click)="onOpenColumnSettings()" class="fab-reload" style="right: 90px !important" matTooltip="{{'device-tree.column-settings' | translate}}">
    <mat-icon>view_column</mat-icon>
</button>
<button mat-icon-button [matMenuTriggerFor]="optionsgMenu" class="fab-reload" style="right: 50px !important">
    <mat-icon>more_vert</mat-icon>
</button>
<input type="file" #fileImportInput style="display: none" id="devicesConfigFileUpload" (change)="onDevTplChangeListener($event, false)" accept=".json,.csv,.xls,.xlsx" />
<input type="file" #tplFileImportInput style="display: none" id="devicesConfigTplUpload" (change)="onDevTplChangeListener($event, true)" accept=".json,.csv,.xls,.xlsx" />
<input type="file" #kepserverFileInput style="display: none" id="kepserverFileUpload" (change)="onKepserverFileChange($event)" accept=".json" />
<mat-menu #optionsgMenu [overlapTrigger]="false">
    <button mat-menu-item [matMenuTriggerFor]="export" style="font-size: 14px;">{{'devices.export' | translate}}</button>
    <mat-menu #export="matMenu" xPosition="before">
        <button mat-menu-item (click)="onExport('json')">{{'devices.export-json' | translate}}</button>
        <button mat-menu-item (click)="onExport('csv')">{{'devices.export-csv' | translate}}</button>
        <button mat-menu-item (click)="onExport('xls')">{{'devices.export-xls' | translate}}</button>
      </mat-menu>
    <mat-divider class="menu-separator"></mat-divider>
    <button mat-menu-item (click)="onImport()" style="font-size: 14px;">{{'devices.import' | translate}}</button>
    <button mat-menu-item (click)="onImportTpl()" style="font-size: 14px;">{{'devices.import-template' | translate}}</button>
    <button mat-menu-item (click)="onImportKepserver()" style="font-size: 14px;">{{'devices.import-kepserver' | translate}}</button>
</mat-menu>
<button mat-icon-button (click)="onReload()" class="fab-reload" [ngClass]="{'fab-reload-active': reloadActive}">
    <mat-icon>autorenew</mat-icon>
</button>
