<div *ngIf="withToolbar" class="table-toolbar"
    [style.backgroundColor]="tableOptions.row.background">
    <div *ngIf="tableOptions.filter.show" class="my-form-field" style="float: left; padding-left: 20px;">
        <input (keyup)="applyFilter($event.target.value)" placeholder="{{'table.history-filter' | translate}}" style="width: 250px;" type="text"
            [style.backgroundColor]="tableOptions.header.background" [style.color]="tableOptions.row.color">
    </div>
    <div *ngIf="tableOptions.daterange.show" class="date-range">
        <div *ngIf="!isEditor">
            <mat-select class="moka-toolbar-editor moka-toolbar-select" [(value)]="tableOptions.lastRange" [style.color]="tableOptions.row.color"
                [style.backgroundColor]="tableOptions.row.background" panelClass="my-select-panel-class" (selectionChange)="onRangeChanged($event.source.value)">
                <mat-option *ngFor="let ev of lastRangeType | enumToArray" [value]="ev.key" [style.color]="tableOptions.row.color"
                    [style.backgroundColor]="tableOptions.row.background">
                    {{ ev.value }}
                </mat-option>
            </mat-select>
            <button mat-flat-button class="moka-toolbar-editor moka-toolbar-button" [style.color]="tableOptions.row.color" [style.backgroundColor]="tableOptions.row.background"
                (click)="onDateRange()">
                <mat-icon aria-label="time range">access_time</mat-icon>
            </button>
            <button mat-flat-button class="moka-toolbar-editor moka-toolbar-button" [style.color]="tableOptions.row.color" [style.backgroundColor]="tableOptions.row.background"
                (click)="onExportData()">
                <mat-icon aria-label="export data">vertical_align_bottom</mat-icon>
            </button>
        </div>
        <div *ngIf="isEditor">
            <button class="moka-toolbar-editor moka-toolbar-select" [style.color]="tableOptions.row.color" [style.background-color]="tableOptions.row.background">
            </button>
            <button class="moka-toolbar-editor moka-toolbar-button" [style.color]="tableOptions.row.color" [style.backgroundColor]="tableOptions.row.background">
                <mat-icon aria-label="time range">access_time</mat-icon>
            </button>
            <button class="moka-toolbar-editor moka-toolbar-button" [style.color]="tableOptions.row.color" [style.backgroundColor]="tableOptions.row.background">
                <mat-icon aria-label="export data">vertical_align_bottom</mat-icon>
            </button>
        </div>
    </div>
    <mat-paginator *ngIf="tableOptions.paginator.show" [pageSizeOptions]="[10, 25, 100]" [pageSize]="25" class="data-table-paginator" [style.color]="tableOptions.row.color">
    </mat-paginator>
</div>
<div class="data-table-scroll" [style.height]="withToolbar ? 'calc(100% - 42px)' : '100%'">
    <mat-table #table [dataSource]="dataSource" [style.backgroundColor]="tableOptions.row.background"
        [style.--mat-table-row-item-outline-color]="tableOptions.gridColor"
        [style.--mdc-data-table-row-divider-color]="tableOptions.gridColor"
        [trackBy]="trackByRow"
        matSort>
        <ng-container *ngFor="let column of displayedColumns" [matColumnDef]="column">
            <th *matHeaderCellDef
                mat-sort-header
                [style.width.px]="columnsStyle[column]?.width ? columnsStyle[column].width : 'auto'"
                [style.color]="columnsStyle[column]?.color ? columnsStyle[column].color : tableOptions.header?.color"
                [style.textAlign]="columnsStyle[column]?.align ? columnsStyle[column].align : 'left'"
                [style.fontSize.px]="tableOptions.header.fontSize">
                {{ columnsStyle[column]?.label }}
            </th>
            <td *matCellDef="let element; index as i"
                class="data-table-row-cell"
                [ngStyle]="{
                    'width.px': columnsStyle[column].width,
                    'text-align': columnsStyle[column].align,
                    'font-size.px': tableOptions.row.fontSize,
                    'color': element[column]?.fontColor || null}">
                <ng-container *ngIf="setOfSourceTableData; else cellTypeSwitch">
                    {{element[column]}}
                </ng-container>
                <ng-template #cellTypeSwitch>
                    <ng-container [ngSwitch]="element[column]?.type">
                        <!-- Input cell -->
                        <ng-container *ngSwitchCase="columnType.input">
                            <input
                                class="table-input-cell"
                                [id]="'table-input-' + i + '-' + column"
                                [type]="element[column]?.inputOptions?.type === 'number' ? 'number' : (element[column]?.inputOptions?.type === 'date' ? 'date' : (element[column]?.inputOptions?.type === 'time' ? 'time' : (element[column]?.inputOptions?.type === 'datetime' ? 'datetime-local' : 'text')))"
                                [attr.step]="element[column]?.inputOptions?.type === 'number' ? 'any' : null"
                                [attr.min]="element[column]?.inputOptions?.min"
                                [attr.max]="element[column]?.inputOptions?.max"
                                [value]="element[column]?.inputValue || ''"
                                [placeholder]="element[column]?.inputOptions?.placeholder || ''"
                                [readonly]="element[column]?.inputOptions?.readonly || false"
                                [attr.maxlength]="element[column]?.inputOptions?.maxlength"
                                [disabled]="isEditor"
                                (keydown.enter)="onInputCellSubmit(element[column], $event.target.value)"
                                (click)="$event.stopPropagation()"
                                [ngStyle]="{
                                    'width': '100%',
                                    'height': '100%',
                                    'border': '1px solid ' + tableOptions.gridColor,
                                    'background': 'transparent',
                                    'color': 'inherit',
                                    'text-align': columnsStyle[column].align,
                                    'font-size.px': tableOptions.row.fontSize,
                                    'box-sizing': 'border-box',
                                    'padding': '0 4px',
                                    'outline': 'none'
                                }">
                        </ng-container>
                        <!-- Button cell -->
                        <ng-container *ngSwitchCase="columnType.button">
                            <button
                                class="table-button-cell"
                                [disabled]="isEditor"
                                (click)="onButtonCellClick(element[column]); $event.stopPropagation()"
                                [ngStyle]="{
                                    'width': '100%',
                                    'height': 'calc(100% - 4px)',
                                    'border': element[column]?.buttonOptions?.style?.border || '1px solid #ccc',
                                    'border-radius': element[column]?.buttonOptions?.style?.borderRadius || '3px',
                                    'background-color': element[column]?.buttonOptions?.style?.backgroundColor || '#e0e0e0',
                                    'color': element[column]?.buttonOptions?.style?.color || 'inherit',
                                    'font-size': (element[column]?.buttonOptions?.style?.fontSize || (tableOptions.row.fontSize + 'px')),
                                    'font-weight': element[column]?.buttonOptions?.style?.fontWeight || 'normal',
                                    'cursor': isEditor ? 'default' : 'pointer',
                                    'box-sizing': 'border-box',
                                    'padding': '0 8px'
                                }">
                                {{ element[column]?.buttonOptions?.text || element[column]?.stringValue || 'Button' }}
                            </button>
                        </ng-container>
                        <!-- Switch cell -->
                        <ng-container *ngSwitchCase="columnType.switch">
                            <label class="table-switch-cell"
                                [style.borderRadius]="(element[column]?.switchOptions?.radius || 0) + 'px'"
                                [style.background]="element[column]?.switchChecked
                                    ? (element[column]?.switchOptions?.onBackground || '#ccc')
                                    : (element[column]?.switchOptions?.offBackground || '#ccc')"
                                (click)="$event.stopPropagation()">
                                <input type="checkbox"
                                    class="table-switch-input"
                                    [checked]="element[column]?.switchChecked"
                                    [disabled]="isEditor"
                                    (change)="element[column].switchChecked = $event.target.checked; onSwitchToggle(element[column])">
                                <span class="table-switch-slider"
                                    [style.background]="element[column]?.switchChecked
                                        ? (element[column]?.switchOptions?.onSliderColor || '#0CC868')
                                        : (element[column]?.switchOptions?.offSliderColor || '#fff')"
                                    [style.color]="element[column]?.switchChecked
                                        ? (element[column]?.switchOptions?.onTextColor || '#fff')
                                        : (element[column]?.switchOptions?.offTextColor || '#000')"
                                    [style.fontSize.px]="element[column]?.switchOptions?.fontSize || 12">
                                    {{ element[column]?.switchChecked
                                        ? (element[column]?.switchOptions?.onText || '')
                                        : (element[column]?.switchOptions?.offText || '') }}
                                </span>
                            </label>
                        </ng-container>
                        <!-- Select cell -->
                        <ng-container *ngSwitchCase="columnType.select">
                            <!-- Readonly: render as text -->
                            <span *ngIf="element[column]?.selectOptions?.readonly && !isEditor"
                                class="table-select-readonly"
                                [ngStyle]="{
                                    'display': 'inline-block',
                                    'width': '100%',
                                    'height': '100%',
                                    'line-height': 'inherit',
                                    'background': getSelectItemColor(element[column], element[column]?.selectValue, 'color') || 'transparent',
                                    'color': getSelectItemColor(element[column], element[column]?.selectValue, 'stroke') || 'inherit',
                                    'text-align': columnsStyle[column].align,
                                    'font-size.px': tableOptions.row.fontSize,
                                    'box-sizing': 'border-box',
                                    'padding': '0 4px'
                                }">{{ getSelectItemText(element[column], element[column]?.selectValue) }}</span>
                            <!-- Normal: render as select -->
                            <select
                                *ngIf="!element[column]?.selectOptions?.readonly || isEditor"
                                class="table-select-cell"
                                [value]="element[column]?.selectValue || ''"
                                [disabled]="isEditor"
                                (change)="element[column].selectValue = $event.target.value; onSelectChange(element[column], $event.target.value)"
                                (click)="$event.stopPropagation()"
                                [ngStyle]="{
                                    'width': '100%',
                                    'height': '100%',
                                    'border': '1px solid ' + tableOptions.gridColor,
                                    'background': getSelectItemColor(element[column], element[column]?.selectValue, 'color') || 'transparent',
                                    'color': getSelectItemColor(element[column], element[column]?.selectValue, 'stroke') || 'inherit',
                                    'text-align': columnsStyle[column].align,
                                    'font-size.px': tableOptions.row.fontSize,
                                    'box-sizing': 'border-box',
                                    'padding': '0 4px',
                                    'outline': 'none'
                                }">
                                <option *ngFor="let item of element[column]?.selectOptions?.items" [value]="item.value">
                                    {{ item.text || item.value }}
                                </option>
                            </select>
                        </ng-container>
                        <!-- Default cell (label, variable, timestamp, device, alarm/report buttons) -->
                        <ng-container *ngSwitchDefault>
                            {{element[column]?.stringValue}}
                            <button mat-icon-button *ngIf="column === alarmColumnType.ack && element.toack >= 0" (click)="onAckAlarm(element)" [disabled]="element.toack === 0">
                                <mat-icon>check_circle_outline</mat-icon>
                            </button>
                            <button mat-icon-button *ngIf="column === reportColumnType.download" (click)="onDownloadReport(element)">
                                <mat-icon>vertical_align_bottom</mat-icon>
                            </button>
                            <button mat-icon-button *ngIf="column === reportColumnType.delete" (click)="onRemoveReportFile(element)" [disabled]="!element.deletable" class="custom-disabled-button">
                                <mat-icon>delete_forever</mat-icon>
                            </button>
                        </ng-container>
                    </ng-container>
                </ng-template>
            </td>
        </ng-container>

        <mat-header-row *matHeaderRowDef="displayedColumns; sticky: true" class="mat-row data-table-header" [style.height.px]="tableOptions.header.height"
            [style.backgroundColor]="tableOptions.header.background" [style.borderBottom]="'1px solid ' + tableOptions.gridColor" [style.display]="(tableOptions.header.show) ? 'flex' : 'none'">
        </mat-header-row>
        <ng-container [ngSwitch]="type">
            <ng-container *ngSwitchCase="tableType.reports">
                <mat-row *matRowDef="let row; columns: displayedColumns; index as i"
                        class="mat-row data-table-row"
                        [ngStyle]="{
                            'cursor': isSelectable() ? 'pointer': 'unset',
                            'height.px': tableOptions.row.height,
                            'background-color': isSelected(row) ? tableOptions.selection.background : tableOptions.row.background,
                            'border-bottom': '1px solid ' + tableOptions.gridColor,
                            'color': isSelected(row) ? tableOptions.selection.color : tableOptions.row.color}">
                </mat-row>
            </ng-container>
            <ng-container *ngSwitchCase="tableType.alarms">
                <mat-row *matRowDef="let row; columns: displayedColumns; index as i"
                        class="mat-row data-table-row"
                        [ngStyle]="{
                            'cursor': isSelectable() ? 'pointer': 'unset',
                            'height.px': tableOptions.row.height,
                            'background-color': row.bkcolor,
                            'border-bottom': '1px solid ' + tableOptions.gridColor,
                            'color': row.color}">
                </mat-row>
            </ng-container>
            <ng-container *ngSwitchCase="tableType.data">
                <mat-row *matRowDef="let row; columns: displayedColumns; index as i"
                        (click)="selectRow(row)"
                        class="mat-row data-table-row"
                        [ngStyle]="{
                        'cursor': isSelectable() ? 'pointer': 'unset',
                        'height.px': tableOptions.row.height,
                        'background-color': isSelected(row) ? tableOptions.selection.background : tableOptions.row.background,
                        'border-bottom': '1px solid ' + tableOptions.gridColor,
                        'color': isSelected(row) ? tableOptions.selection.color : tableOptions.row.color}">
                </mat-row>
            </ng-container>
            <ng-container *ngSwitchCase="tableType.history">
                <mat-row *matRowDef="let row; columns: displayedColumns; index as i"
                        (click)="selectRow(row)"
                        class="mat-row data-table-row"
                        [ngStyle]="{
                        'cursor': isSelectable() ? 'pointer': 'unset',
                        'height.px': tableOptions.row.height,
                        'background-color': isSelected(row) ? tableOptions.selection.background : tableOptions.row.background,
                        'border-bottom': '1px solid ' + tableOptions.gridColor,
                        'color': isSelected(row) ? tableOptions.selection.color : tableOptions.row.color}">
                </mat-row>
            </ng-container>
        </ng-container>
    </mat-table>
</div>
<div *ngIf="!isEditor && type === tableHistoryType" class="reload-btn" [style.top.px]="withToolbar ? 45 : 0">
    <button mat-icon-button
            (click)="onRefresh()"
            class="small-icon-button default-color"
            [style.color]="tableOptions.header.color">
        <mat-icon [ngClass]="{'reload-active': reloadActive}">autorenew</mat-icon>
    </button>
</div>
<div *ngIf="loading" class="spinner">
    <mat-spinner style="margin: auto" diameter="40"></mat-spinner>
</div>
